name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.check.outputs.docker }}
      kube: ${{ steps.check.outputs.kube }}
    steps:
    - name: Check required secrets
      id: check
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      run: |
        if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
          echo "docker=true" >> "$GITHUB_OUTPUT"
        else
          echo "docker=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=CD omitido::Faltan DOCKER_USERNAME/DOCKER_PASSWORD; no se construye ni publica la imagen."
        fi
        if [ -n "$KUBE_CONFIG" ]; then
          echo "kube=true" >> "$GITHUB_OUTPUT"
        else
          echo "kube=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Deploy omitido::Falta KUBE_CONFIG; no se despliega en Kubernetes."
        fi

  build-and-push:
    needs: preflight
    if: needs.preflight.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: sparktree/backend:latest, sparktree/backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: [preflight, build-and-push]
    if: needs.preflight.outputs.docker == 'true' && needs.preflight.outputs.kube == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Set up kubeconfig
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig

    - name: Deploy to Kubernetes
      run: |
        export KUBECONFIG=kubeconfig
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/secrets.yaml
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/postgres-deployment.yaml
        kubectl apply -f k8s/redis-deployment.yaml
        kubectl apply -f k8s/services.yaml
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl apply -f k8s/worker-deployment.yaml
        kubectl apply -f k8s/ingress.yaml

    - name: Wait for deployment
      run: |
        export KUBECONFIG=kubeconfig
        kubectl rollout status deployment/sparktree-backend -n sparktree --timeout=5m
        kubectl rollout status deployment/sparktree-worker -n sparktree --timeout=5m
