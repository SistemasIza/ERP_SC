<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Chatbot Analytics Dashboard</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-dark-bg font-sans text-slate-900 dark:text-slate-100 antialiased transition-colors duration-300">
    <div id="root">
      <div style="height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0D1117; font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif; gap: 1.5rem;">
        <style>
          @keyframes l15 { 100% { transform: rotate(1turn); } }
          .init-loader {
            width: 65px;
            aspect-ratio: 1;
            display: grid;
            border: 4px solid transparent;
            border-radius: 50%;
            border-right-color: #3b82f6;
            animation: l15 1s infinite linear;
            position: relative;
          }
          .init-loader::before,
          .init-loader::after {
            content: "";
            grid-area: 1/1;
            margin: 4px;
            border: inherit;
            border-radius: 50%;
            animation: l15 2s infinite;
          }
          .init-loader::after {
            margin: 12px;
            animation-duration: 3s;
          }
          @keyframes bounce-dots { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
          .dot1 { animation: bounce-dots 1s infinite 0ms; }
          .dot2 { animation: bounce-dots 1s infinite 150ms; }
          .dot3 { animation: bounce-dots 1s infinite 300ms; }
        </style>
        <div class="init-loader"></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 0.375rem;">
          <p style="color: white; font-weight: 700; font-size: 1rem; letter-spacing: -0.025em; margin: 0;">SPARKBOT</p>
          <p style="color: #64748b; font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.35em; margin: 0; display: flex; align-items: center; gap: 0.25rem;">
            Por favor espera
            <span style="display:flex; gap: 2px;">
              <span class="dot1" style="display:inline-block;">.</span>
              <span class="dot2" style="display:inline-block;">.</span>
              <span class="dot3" style="display:inline-block;">.</span>
            </span>
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
