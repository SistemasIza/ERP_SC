apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparktree-worker
  namespace: sparktree
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sparktree-worker
  template:
    metadata:
      labels:
        app: sparktree-worker
    spec:
      containers:
      - name: worker
        image: sparktree/backend:latest
        command: ["npm", "run", "worker:automation"]
        env:
        - name: NODE_ENV
          value: "production"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: sparktree-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: sparktree-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sparktree-secrets
              key: db-password
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
